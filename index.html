<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jam Digital</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      color: lime;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #clock {
      font-size: 12vw;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="clock">--:--:--</div>

  <script>
    const clock = document.getElementById("clock");

    function updateClock() {
      const now = new Date();
      const jam = now.getHours().toString().padStart(2, '0');
      const menit = now.getMinutes().toString().padStart(2, '0');
      const detik = now.getSeconds().toString().padStart(2, '0');
      clock.textContent = `${jam}:${menit}:${detik}`;
    }

    function adjustFont() {
      const type = screen.orientation.type;
      if (type.startsWith("portrait")) {
        clock.style.fontSize = "12vw";
      } else {
        clock.style.fontSize = "8vh";
      }
    }

    function requestWakeLock() {
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').then(lock => {
          console.log("Wake lock aktif");
          lock.addEventListener('release', () => console.log('Wake lock dilepas'));
        }).catch(err => console.error("WakeLock error:", err));
      }
    }

    function enterFullscreen() {
      const el = document.documentElement;
      if (el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
      }
    }

    // Mulai
    updateClock();
    setInterval(updateClock, 1000);
    adjustFont();

    // Event
    screen.orientation.addEventListener('change', () => {
      adjustFont();
      enterFullscreen(); // coba masuk fullscreen saat rotasi
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        requestWakeLock();
      }
    });

    // Saat pertama kali user menyentuh layar → aktifkan fullscreen & wakelock
    document.addEventListener('click', () => {
      enterFullscreen();
      requestWakeLock();
    }, { once: true }); // hanya sekali saja

  </script>
</body>
</html>
