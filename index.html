<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>DATETIME</title>
    <link rel="shortcut icon" href="icon-192.png" type="image/x-icon" />
    <style>
        /* latin */
        @font-face {
            font-family: 'Share Tech Mono';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('share-tech-mono.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }

        :root {
            --bg-dark: #050505;
            --text-dark: #00ff41;
            --glow-dark: rgba(0, 255, 65, 0.5);
            --bg-light: #e8e8e8;
            --text-light: #1a5c1a;
            --glow-light: rgba(26, 92, 26, 0.25);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: var(--bg-dark);
            color: var(--text-dark);
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            transition: background 0.3s, color 0.3s, text-shadow 0.3s;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Hacker glow effect — dark state */
        body:not(.light) #greeting,
        body:not(.light) #clock,
        body:not(.light) #date,
        body:not(.light) #battery {
            text-shadow: 0 0 8px var(--glow-dark), 0 0 2px var(--glow-dark);
        }

        /* Light hacker variant */
        body.light {
            background: var(--bg-light);
            color: var(--text-light);
        }

        body.light #greeting,
        body.light #clock,
        body.light #date,
        body.light #battery {
            text-shadow: 0 0 4px var(--glow-light);
        }

        #greeting {
            font-size: clamp(1rem, 4vw, 2rem);
            margin-bottom: 0.2em;
            opacity: 0.9;
        }

        #clock {
            font-size: clamp(2.5rem, 10vw, 8rem);
            line-height: 1;
            font-weight: 400;
            letter-spacing: -0.02em;
        }

        #date {
            font-size: clamp(1rem, 3.5vw, 1.75rem);
            margin-top: 0.3em;
            opacity: 0.85;
        }

        #battery {
            font-size: clamp(0.875rem, 2.5vw, 1.25rem);
            margin-top: 0.5em;
            opacity: 0.75;
        }

        .hint {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            font-size: 0.7rem;
            opacity: 0.4;
            letter-spacing: 0.05em;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="greeting">...</div>
    <div id="clock">--:--:--</div>
    <div id="date">Sedang memuat...</div>
    <div id="battery">Memuat status baterai...</div>
    <div class="hint" id="hint">[ TAP / KLIK UNTUK LAYAR PENUH ]</div>

    <script>
        const greeting = document.getElementById("greeting");
        const clock = document.getElementById("clock");
        const date = document.getElementById("date");
        const batteryDiv = document.getElementById("battery");
        const hint = document.getElementById("hint");

        const hari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const bulan = [
            'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
            'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
        ];

        function updateGreetingAndTheme() {
            const now = new Date();
            const hour = now.getHours();
            let ucapan = "Halo";

            if (hour >= 4 && hour < 11) {
                ucapan = "Selamat Pagi";
                setLightTheme();
            } else if (hour >= 11 && hour < 15) {
                ucapan = "Selamat Siang";
                setLightTheme();
            } else if (hour >= 15 && hour < 18) {
                ucapan = "Selamat Sore";
                setDarkTheme();
            } else {
                ucapan = "Selamat Malam";
                setDarkTheme();
            }

            greeting.textContent = ucapan;
        }

        function setDarkTheme() {
            document.body.classList.remove('light');
        }

        function setLightTheme() {
            document.body.classList.add('light');
        }

        function updateClock() {
            const now = new Date();

            const jam = now.getHours().toString().padStart(2, '0');
            const menit = now.getMinutes().toString().padStart(2, '0');
            const detik = now.getSeconds().toString().padStart(2, '0');
            clock.textContent = `${jam}:${menit}:${detik}`;

            const tgl = now.getDate();
            const day = hari[now.getDay()];
            const month = bulan[now.getMonth()];
            const year = now.getFullYear();
            date.textContent = `${day}, ${tgl} ${month} ${year}`;

            updateGreetingAndTheme();
        }

        updateClock();
        setInterval(updateClock, 1000);

        function isAndroid() {
            return /Android/i.test(navigator.userAgent);
        }

        function isIOS() {
            return /iPhone|iPad|iPod/i.test(navigator.userAgent);
        }

        if ((isAndroid() || isIOS()) && 'getBattery' in navigator) {
            try {
                const battery = await navigator.getBattery();
                function updateBatteryStatus() {
                    const percent = Math.round(battery.level * 100);
                    const charging = battery.charging ? " ⚡" : "";
                    batteryDiv.textContent = `BATERAI: ${percent}%${charging}`;
                }
                updateBatteryStatus();
                battery.addEventListener('levelchange', updateBatteryStatus);
                battery.addEventListener('chargingchange', updateBatteryStatus);
            } catch (err) {
                console.debug(`Battery status unavailable: ${err.message}`);
                batteryDiv.textContent = 'BATERAI: --';
                batteryDiv.style.display = 'none';
            }
        } else {
            batteryDiv.textContent = 'BATERAI: --';
            batteryDiv.style.display = 'none';
        }

        let wakeLock = null;

        async function requestWakeLock() {
            try {
                if (wakeLock !== null) {
                    await wakeLock.release();
                }
                wakeLock = await navigator.wakeLock.request('screen');
                console.log("Wake Lock aktif");

                wakeLock.addEventListener('release', () => {
                    console.log("Wake Lock terlepas");
                });
            } catch (err) {
                console.error(`${err.name}, ${err.message}`);
            }
        }

        function enterFullscreen() {
            const el = document.documentElement;
            if (el.requestFullscreen) {
                el.requestFullscreen().catch(err => console.debug('Fullscreen denied:', err));
            }
            if (hint) hint.style.display = 'none';
        }

        screen.orientation.addEventListener('change', () => {
            enterFullscreen();
        });

        if ('wakeLock' in navigator) {
            requestWakeLock();
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    requestWakeLock();
                }
            });
        }

        function enableFullscreenAndWakeLock() {
            enterFullscreen();
            requestWakeLock();
        }

        document.addEventListener('click', enableFullscreenAndWakeLock, { once: true });
        document.addEventListener('touchstart', enableFullscreenAndWakeLock, { once: true });
    </script>
</body>
</html>
