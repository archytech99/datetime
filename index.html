<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>DATETIME</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="/media/Logo.png" type="image/x-icon" />

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;600&display=swap" rel="stylesheet">

    <!-- Styles -->
    <style>
        html, body {
            background-color: #fff;
            color: #636b6f;
            font-family: 'Nunito', sans-serif;
            font-weight: 200;
            height: 100vh;
            margin: 0;
        }
        .full-height {
            height: 100vh;
        }
        .flex-center {
            align-items: center;
            display: flex;
            justify-content: center;
        }
        .position-ref {
            position: relative;
        }
        .top-right {
            position: absolute;
            right: 10px;
            top: 18px;
        }
        .content {
            text-align: center;
        }
        .title {
            font-size: 84px;
        }
        .links > a {
            color: #636b6f;
            padding: 0 25px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .1rem;
            text-decoration: none;
            text-transform: uppercase;
        }
        .m-b-md {
            margin-bottom: 30px;
        }
        .logo-pmu {
            width: 35%;
        }
        #clock {
            font-size: 12vw;
            line-height: 1;
        }
        #date {
            font-size: 4.75vw;
            margin-top: 0.5em;
        }
        @media (orientation: landscape) {
            #clock {
                font-size: 28vh;
            }
            #date {
                font-size: 10vh;
            }
        }
    </style>
</head>

<body>
    <div class="flex-center position-ref full-height">
        <div class="top-right links">
            <!-- // -->
        </div>

        <div class="content">
            <!-- <img src="/media/Logo.png" class="logo-pmu"> -->
            <div class="title m-b-md">
                <div id="clock">--:--:--</div>
                <div id="date">Sedang memuat...</div>
            </div>
        </div>
    </div>

    <script>
        const clock = document.getElementById("clock");
        const date = document.getElementById("date");

        const hari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const bulan = [
            'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
            'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
        ];

        function updateClock() {
            const now = new Date();

            // Jam
            const jam = now.getHours().toString().padStart(2, '0');
            const menit = now.getMinutes().toString().padStart(2, '0');
            const detik = now.getSeconds().toString().padStart(2, '0');
            clock.textContent = `${jam}:${menit}:${detik}`;

            // Tanggal
            const tgl = now.getDate();
            const day = hari[now.getDay()];
            const month = bulan[now.getMonth()];
            const year = now.getFullYear();
            date.textContent = `${day}, ${tgl} ${month} ${year}`;
        }

        updateClock();
        setInterval(updateClock, 1000);

        // Wake Lock
        let wakeLock = null;

        async function requestWakeLock() {
            try {
                if (wakeLock !== null) {
                    await wakeLock.release();
                }
                wakeLock = await navigator.wakeLock.request('screen');
                console.log("Wake Lock aktif");

                wakeLock.addEventListener('release', () => {
                    console.log("Wake Lock terlepas");
                });
            } catch (err) {
                console.error(`${err.name}, ${err.message}`);
            }
        }

        function enterFullscreen() {
            const el = document.documentElement;
            if (el.requestFullscreen) {
                el.requestFullscreen().catch(() => {});
            }
        }

        screen.orientation.addEventListener('change', () => {
            enterFullscreen(); // tetap fullscreen saat rotasi
        });

        if ('wakeLock' in navigator) {
            requestWakeLock();
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    requestWakeLock();
                }
            });
        }

        function enableFullscreenAndWakeLock() {
            enterFullscreen();
            requestWakeLock();
        }

        document.addEventListener('click', enableFullscreenAndWakeLock, { once: true });
        document.addEventListener('touchstart', enableFullscreenAndWakeLock, { once: true });
    </script>
</body>
</html>
