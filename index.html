<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>DATETIME</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon" />

	<!-- Font Share Tech Mono -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
	
	<!-- Font Orbitron -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@200..900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- Styles -->
    <style>
        html, body {
            background-color: #fff;
            color: #636b6f;
            font-family: 'Nunito', sans-serif;
            font-weight: 200;
            height: 100vh;
            margin: 0;
        }
        .full-height {
            height: 100vh;
        }
        .flex-center {
            align-items: center;
            display: flex;
            justify-content: center;
        }
        .position-ref {
            position: relative;
        }
        .top-right {
            position: absolute;
            right: 10px;
            top: 18px;
        }
        .content {
            text-align: center;
        }
        .title {
            font-size: 84px;
        }
        .links > a {
            color: #636b6f;
            padding: 0 25px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: .1rem;
            text-decoration: none;
            text-transform: uppercase;
        }
        .m-b-md {
            margin-bottom: 30px;
        }
        .logo-pmu {
            width: 35%;
        }
		#greeting {
			font-size: 4vw;
			margin-bottom: 0.5em;
			font-weight: bold;
		}
        #clock {
			font-family: "Share Tech Mono", monospace;
			font-weight: 400;
            font-size: 12vw;
            line-height: 1;
        }
        #date {
			font-family: "Share Tech Mono", monospace;
			font-weight: 200;
            font-size: 4.75vw;
            margin-top: 0.5em;
        }
        #battery {
			font-family: "Orbitron", sans-serif;
			font-optical-sizing: auto;
            font-size: 3.85vw;
            margin-top: 0.5em;
        }
        @media (orientation: landscape) {
            #clock {
                font-size: 28vh;
            }
            #date {
                font-size: 11.25vh;
            }
            #battery {
                font-size: 5.75vh;
				margin-top: 1.5em;
            }
        }
    </style>
</head>

<body>
    <div class="flex-center position-ref full-height">
        <div class="top-right links">
            <!-- // -->
        </div>

        <div class="content">
            <!-- <img src="/media/Logo.png" class="logo-pmu"> -->
            <div class="title m-b-md">
				<div id="greeting">...</div>
                <div id="clock">--:--:--</div>
                <div id="date">Sedang memuat...</div>
                <div id="battery">Memuat status baterai...</div>
            </div>
        </div>
    </div>

    <script>
		const greeting = document.getElementById("greeting");
        const clock = document.getElementById("clock");
        const date = document.getElementById("date");
        const batteryDiv = document.getElementById("battery");

        const hari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const bulan = [
            'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
            'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
        ];

		function updateGreetingAndTheme() {
			const now = new Date();
			const hour = now.getHours();
			let ucapan = "Halo";

			if (hour >= 5 && hour < 11) {
				ucapan = "Selamat Pagi";
				setLightTheme();
			} else if (hour >= 11 && hour < 15) {
				ucapan = "Selamat Siang";
				setLightTheme();
			} else if (hour >= 15 && hour < 19) {
				ucapan = "Selamat Sore";
				setLightTheme();
			} else {
				ucapan = "Selamat Malam";
				setDarkTheme();
			}

			greeting.textContent = ucapan;
		}

		function setDarkTheme() {
			document.body.style.backgroundColor = "black";
			document.body.style.color = "lime";
		}

		function setLightTheme() {
			document.body.style.backgroundColor = "white";
			document.body.style.color = "black";
		}

        function updateClock() {
            const now = new Date();

            // Jam
            const jam = now.getHours().toString().padStart(2, '0');
            const menit = now.getMinutes().toString().padStart(2, '0');
            const detik = now.getSeconds().toString().padStart(2, '0');
            clock.textContent = `${jam}:${menit}:${detik}`;

            // Tanggal
            const tgl = now.getDate();
            const day = hari[now.getDay()];
            const month = bulan[now.getMonth()];
            const year = now.getFullYear();
            date.textContent = `${day}, ${tgl} ${month} ${year}`;

			updateGreetingAndTheme();
        }

        updateClock();
        setInterval(updateClock, 1000);

		// Platform detection
		function isAndroid() {
			return /Android/i.test(navigator.userAgent);
		}

		function isIOS() {
			return /iPhone|iPad|iPod/i.test(navigator.userAgent);
		}

		// Baterai (khusus Android & iOS yang mendukung)
		if ((isAndroid() || isIOS()) && 'getBattery' in navigator) {
			navigator.getBattery().then(function(battery) {
				function updateBatteryStatus() {
					const percent = Math.round(battery.level * 100);
					const charging = battery.charging ? "⚡" : "";
					batteryDiv.textContent = `Baterai: ${percent}% ${charging}`;
				}
				updateBatteryStatus();
				battery.addEventListener('levelchange', updateBatteryStatus);
				battery.addEventListener('chargingchange', updateBatteryStatus);
			});
		} else {
			batteryDiv.remove(); // sembunyikan/hapus jika bukan Android/iOS atau tidak didukung
		}

        // Wake Lock
        let wakeLock = null;

        async function requestWakeLock() {
            try {
                if (wakeLock !== null) {
                    await wakeLock.release();
                }
                wakeLock = await navigator.wakeLock.request('screen');
                console.log("Wake Lock aktif");

                wakeLock.addEventListener('release', () => {
                    console.log("Wake Lock terlepas");
                });
            } catch (err) {
                console.error(`${err.name}, ${err.message}`);
            }
        }

        function enterFullscreen() {
            const el = document.documentElement;
            if (el.requestFullscreen) {
                el.requestFullscreen().catch(() => {});
            }
        }

        screen.orientation.addEventListener('change', () => {
            enterFullscreen(); // tetap fullscreen saat rotasi
        });

        if ('wakeLock' in navigator) {
            requestWakeLock();
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    requestWakeLock();
                }
            });
        }

        function enableFullscreenAndWakeLock() {
            enterFullscreen();
            requestWakeLock();
        }

        document.addEventListener('click', enableFullscreenAndWakeLock, { once: true });
        document.addEventListener('touchstart', enableFullscreenAndWakeLock, { once: true });
    </script>
</body>
</html>
